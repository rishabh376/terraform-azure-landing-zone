apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-azure-landing-zone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terraform-azure-landing-zone
  template:
    metadata:
      labels:
        app: terraform-azure-landing-zone
    spec:
      containers:
      - name: app
        image: ghcr.io/example/terraform-azure-landing-zone:latest
        ports:
        - containerPort: 8080
        livenessProbe: { httpGet: { path: /healthz, port: 8080 } }
        readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
